[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "collective-intelligence-library"
version = "0.1.0"
description = "Composable mechanism simulation via functional graph transforms"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.4.20"]
export = ["jsonschema>=4.17"]      # bundle validation on write (experiments/gd_bundles)
service = ["fastapi>=0.110", "uvicorn>=0.29"]  # the RemoteEngine (service/)
full = [
    "jax[cuda12]>=0.4.20",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cilib*"]
